name: ago
description: "A professional carpooling platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter


  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3

  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  firebase_storage: ^13.4.5

  google_sign_in: ^6.3.0

  flutter_local_notifications: ^22.1.0
  audioplayers: ^6.8.1

  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  geoflutterfire_plus: ^0.0.34
  intl: ^0.20.3
  google_maps_flutter: ^2.18.0
  google_api_headers: ^5.2.0
  video_player: ^2.13.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/after_logo.png
    - assets/images/app_logo.png
    - assets/images/avatar_collection_clean.png
    - assets/images/home_hero.png
    - assets/images/profile_hero.png
    - assets/images/ride_group_hero1.png
    - assets/images/ride_together.png
    - assets/images/zero_fees.png
    - assets/videos/
    - assets/map_markers/